<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23007aff'/><text x='90' y='125' font-family='-apple-system,system-ui,sans-serif' font-size='94' font-weight='700' fill='white' text-anchor='middle'>B</text></svg>">
<title>Budget</title>
<style>
  :root {
    color-scheme: light;
    --bg:#ffffff; --card:#f5f5f7; --card2:#e5e5ea;
    --txt:#000; --muted:#8e8e93; --line:#ebebef;
    --blue:#007aff; --red:#ff3b30; --green:#30d158;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg); color: var(--txt);
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    margin: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
    padding-left: 20px; padding-right: 20px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 500px; margin-left: auto; margin-right: auto;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body.locked { overflow: hidden; }
  input { -webkit-user-select: text; user-select: text; -webkit-appearance: none; }
  button { -webkit-appearance: none; touch-action: manipulation; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .header .title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .icon-btn { background: none; border: none; color: var(--txt); padding: 6px; cursor: pointer; }

  .hero { text-align: center; margin-bottom: 22px; }
  .hero .label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .hero .amount {
    font-size: 44px; font-weight: 700; letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .hero .amount.neg { color: var(--red); }
  .hero .sub { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .tiles { display: flex; gap: 10px; margin-bottom: 26px; }
  .tile { background: var(--card); border-radius: 14px; padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .tile.month { flex: 1.6; } .tile.days { flex: 1; }
  .tile .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; margin-bottom: 6px; }
  .tile .val { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.days .val { font-size: 20px; }

  .list-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 4px; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    min-height: 56px; cursor: pointer;
  }
  .item:active { opacity: .5; }
  .item:last-child { border-bottom: none; }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .item .col { flex: 1; min-width: 0; }
  .item .cat { font-size: 15px; font-weight: 500; }
  .item .time { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .amt { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .item .amt.income { color: var(--green); }

  .trash-btn {
    width: 40px; height: 40px;
    border-radius: 50%; background: none; border: none;
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto;
    padding: 0; margin-left: -4px;
    transition: color .15s, background .15s;
  }
  .trash-btn:active {
    background: rgba(255,59,48,.12);
    color: var(--red);
  }

  .fab {
    position: fixed; right: 20px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--blue); color: #fff; border: none;
    font-size: 30px; font-weight: 300; line-height: 1;
    box-shadow: 0 6px 24px rgba(0,122,255,.35);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 40;
  }
  .fab:active { transform: scale(.94); }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet.open { opacity: 1; pointer-events: auto; }
  .sheet-inner {
    background: #fff; width: 100%; max-width: 500px;
    border-radius: 20px 20px 0 0;
    padding-top: 8px; padding-left: 20px; padding-right: 20px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    max-height: 92vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; touch-action: pan-y;
  }
  .sheet.open .sheet-inner { transform: translateY(0); }
  .handle { width: 36px; height: 5px; border-radius: 3px; background: var(--card2); margin: 8px auto 16px; touch-action: none; }
  .sheet-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 12px; letter-spacing: -0.3px; }

  .segmented {
    display: flex; background: var(--card);
    border-radius: 10px; padding: 3px; margin-bottom: 10px;
  }
  .segmented button {
    flex: 1; padding: 10px 0; border: none; border-radius: 8px;
    background: transparent; color: var(--txt);
    font-size: 14px; font-weight: 600; cursor: pointer;
    min-height: 40px;
    transition: background .15s, color .15s, box-shadow .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .segmented button.active[data-kind="expense"] {
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); color: var(--txt);
  }
  .segmented button.active[data-kind="income"] {
    background: var(--green); color: #fff;
  }
  .segmented .ico { font-size: 15px; font-weight: 700; }

  .amount-display {
    padding: 4px 0 14px;
    font-variant-numeric: tabular-nums;
    min-height: 74px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    position: relative;
  }
  .amount-display .cur { font-size: 20px; color: var(--muted); font-weight: 600; }
  .amount-display .val { font-size: 52px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
  .amount-display .val.empty { color: var(--card2); }
  .amount-display.income .cur { color: var(--green); }
  .amount-display.income .val:not(.empty) { color: var(--green); }

  .mic-btn {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--card); border: none;
    color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .mic-btn.recording {
    background: var(--red); color: #fff;
    animation: pulse 1s infinite;
  }
  .mic-btn.recording::after {
    content: ''; position: absolute; inset: -4px;
    border-radius: 50%; border: 2px solid var(--red);
    animation: ring 1.2s infinite;
    pointer-events: none;
  }
  @keyframes pulse { 0%,100% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.06); } }
  @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }

  .voice-banner {
    display: none; align-items: center; gap: 10px;
    background: #e8f2ff; color: var(--blue);
    padding: 10px 14px; border-radius: 12px;
    margin-bottom: 10px; font-size: 14px;
  }
  .voice-banner.show { display: flex; }
  .voice-banner b { font-weight: 700; }
  .voice-banner.error { background: #ffe8e5; color: var(--red); }
  .voice-banner .vb-clear {
    margin-left: auto; background: none; border: none;
    color: inherit; cursor: pointer; font-size: 15px; padding: 4px 6px;
  }

  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .numpad button {
    padding: 18px 0; border: none; border-radius: 12px;
    background: var(--card); color: var(--txt);
    font-size: 24px; font-weight: 500; cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background .1s; min-height: 56px;
  }
  .numpad button:active { background: var(--card2); }
  .numpad button.comma { font-size: 26px; }
  .numpad button.backspace { font-size: 22px; }

  .field-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 8px 0 10px; font-weight: 600; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cat-chip {
    padding: 12px 18px; border-radius: 999px;
    background: var(--card); border: 1.5px solid transparent;
    color: var(--txt); font-size: 14px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px;
  }
  .cat-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .cat-chip.active { border-color: var(--txt); background: #fff; }
  .cat-chip.add { background: transparent; border: 1.5px dashed var(--card2); color: var(--muted); }

  .new-cat-row { display: none; gap: 8px; margin-bottom: 14px; }
  .new-cat-row.open { display: flex; }
  .new-cat-row input {
    flex: 1; padding: 12px 14px; font-size: 16px;
    border-radius: 10px; border: 1px solid var(--card2);
    background: var(--bg); color: var(--txt); outline: none; min-height: 44px;
  }
  .new-cat-row input:focus { border-color: var(--blue); }
  .new-cat-row button {
    padding: 0 18px; border: none; border-radius: 10px;
    background: var(--blue); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; min-height: 44px;
  }

  .primary-btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: var(--blue); color: #fff; font-size: 17px; font-weight: 600;
    cursor: pointer; margin-top: 4px; min-height: 52px;
    transition: background .15s;
  }
  .primary-btn.income { background: var(--green); }
  .primary-btn:disabled { background: var(--card2); color: var(--muted); cursor: default; }

  .secondary-btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: var(--card); color: var(--txt); font-size: 15px; font-weight: 500;
    cursor: pointer; margin-top: 8px; text-align: left; min-height: 48px;
  }
  .danger-btn { color: var(--red); }

  .settings-section { margin-bottom: 24px; }
  .settings-input-row { display: flex; gap: 8px; }
  .settings-input-row input {
    flex: 1; padding: 14px; font-size: 16px;
    border-radius: 10px; border: 1px solid var(--card2);
    background: var(--bg); color: var(--txt); outline: none; min-height: 48px;
  }
  .settings-input-row input:focus { border-color: var(--blue); }
  .settings-input-row button {
    padding: 0 18px; border: none; border-radius: 10px;
    background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; min-height: 48px;
  }

  .month-nav { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 4px; }
  .month-nav button { background: none; border: none; font-size: 18px; color: var(--txt); padding: 12px 18px; cursor: pointer; min-height: 44px; min-width: 44px; }
  .month-nav button:disabled { opacity: .3; }
  .month-nav span { font-size: 15px; font-weight: 600; }

  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; min-height: 44px; gap: 12px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--green); white-space: nowrap; }
  .stat-row .stat-value.neg { color: var(--red); }
  .stat-row.total { border-top: 1px solid var(--card2); border-bottom: none; margin-top: 6px; padding-top: 16px; font-weight: 700; font-size: 15px; }
  .stat-empty { color: var(--muted); font-size: 14px; padding: 12px 0; text-align: center; }

  .stats-toggle {
    width: 100%; padding: 14px 16px; border: none; border-radius: 12px;
    background: var(--card); color: var(--txt);
    font-size: 15px; font-weight: 500;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; min-height: 48px; text-align: left;
  }
  .stats-toggle .chev { transition: transform .25s ease; flex: 0 0 auto; }
  .stats-toggle.open .chev { transform: rotate(180deg); }

  .stats-content { display: none; padding: 0 4px; }
  .stats-content.open { display: block; }

  .stat-group { margin-top: 18px; }
  .stat-group:first-child { margin-top: 14px; }
  .stat-group-title {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.6px; font-weight: 600; margin-bottom: 6px;
  }
  .stat-line {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; font-size: 14px; gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .stat-line:last-child { border-bottom: none; }
  .stat-line .sl-label { color: var(--muted); flex: 0 0 auto; }
  .stat-line .sl-value {
    font-weight: 600; font-variant-numeric: tabular-nums;
    text-align: right; color: var(--txt); line-height: 1.3;
  }
  .stat-line .sl-value.pos { color: var(--green); }
  .stat-line .sl-sub {
    display: block; font-weight: 400; color: var(--muted);
    font-size: 12px; margin-top: 2px;
  }

  .snackbar {
    position: fixed; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    transform: translate(-50%, 20px);
    background: #1c1c1e; color: #fff;
    padding: 12px 18px; border-radius: 12px; font-size: 14px;
    display: flex; gap: 16px; align-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 60; max-width: calc(100vw - 40px);
  }
  .snackbar.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .snackbar button { background: none; border: none; color: #64b5ff; font-weight: 600; font-size: 14px; cursor: pointer; padding: 0; }

  .confirm-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .confirm-modal.open { opacity: 1; pointer-events: auto; }
  .confirm-box {
    background: #fff; border-radius: 16px;
    padding: 24px 20px 16px;
    max-width: 300px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    transform: scale(.95);
    transition: transform .2s cubic-bezier(.32,.72,0,1);
  }
  .confirm-modal.open .confirm-box { transform: scale(1); }
  .confirm-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px; }
  .confirm-body { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .confirm-body b { color: var(--txt); font-weight: 600; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button {
    flex: 1; padding: 12px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    min-height: 44px;
  }
  .confirm-cancel { background: var(--card); color: var(--txt); }
  .confirm-ok { background: var(--red); color: #fff; }
</style>
</head>
<body>

<div class="header">
  <div class="title">Budget</div>
  <button class="icon-btn" id="gearBtn" title="Einstellungen">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<div class="hero">
  <div class="label" id="heroLabel">Heute noch verfügbar</div>
  <div class="amount" id="heroAmount">—</div>
  <div class="sub" id="heroSub"></div>
</div>

<div class="tiles">
  <div class="tile month"><div class="lbl">Rest Monat</div><div class="val" id="tileRest">—</div></div>
  <div class="tile days"><div class="lbl">Tage übrig</div><div class="val" id="tileDays">—</div></div>
</div>

<div class="list-title" id="listTitle">Diesen Monat</div>
<div id="list"></div>

<button class="fab" id="addBtn">+</button>

<div class="sheet" id="amountSheet">
  <div class="sheet-inner">
    <div class="handle"></div>
    <div class="sheet-title" id="sheetTitle">Neue Ausgabe</div>

    <div class="segmented" id="segmented">
      <button data-kind="expense" class="active"><span class="ico">−</span>Ausgabe</button>
      <button data-kind="income"><span class="ico">+</span>Einnahme</button>
    </div>

    <div class="amount-display" id="amountDisplay">
      <span class="cur">CHF</span>
      <span class="val empty" id="amountValue">0</span>
      <button class="mic-btn" id="micBtn" title="Spracheingabe">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="voice-banner" id="voiceBanner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      </svg>
      <span class="vb-text">Erkannt: <b id="voiceAmount">—</b></span>
      <button class="vb-clear" id="voiceClear" title="Verwerfen">✕</button>
    </div>
    <div class="numpad" id="numpad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="," class="comma">,</button><button data-key="0">0</button><button data-key="back" class="backspace">⌫</button>
    </div>
    <div class="field-label">Kategorie</div>
    <div class="cats" id="catChips"></div>
    <div class="new-cat-row" id="newCatRow">
      <input type="text" id="newCatInput" placeholder="Name der Kategorie">
      <button id="newCatSave">Erstellen</button>
    </div>
    <button class="primary-btn" id="saveBtn" disabled>Hinzufügen</button>
  </div>
</div>

<div class="sheet" id="settingsSheet">
  <div class="sheet-inner">
    <div class="handle"></div>
    <div class="sheet-title">Einstellungen</div>
    <div class="settings-section">
      <div class="field-label">Monatsbudget (CHF)</div>
      <div class="settings-input-row">
        <input type="text" id="budgetInput" inputmode="decimal" placeholder="z. B. 1500">
        <button id="budgetSave">Speichern</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="field-label">Monat anzeigen</div>
      <div class="month-nav">
        <button id="prevMonth">‹</button>
        <span id="monthLabel">—</span>
        <button id="nextMonth">›</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="field-label">Monatsübersicht</div>
      <div id="statsList"></div>
    </div>
    <div class="settings-section">
      <button class="secondary-btn" id="exportBtn">Backup exportieren</button>
      <button class="secondary-btn danger-btn" id="clearMonthBtn">Diesen Monat leeren</button>
    </div>
    <div class="settings-section">
      <button class="stats-toggle" id="statsToggle">
        <span>Statistiken</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="stats-content" id="statsContent"></div>
    </div>
  </div>
</div>

<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Eintrag löschen?</div>
    <div class="confirm-body" id="confirmBody"></div>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancel">Abbrechen</button>
      <button class="confirm-ok" id="confirmOk">Löschen</button>
    </div>
  </div>
</div>

<div class="snackbar" id="snackbar">
  <span id="snackText">Gelöscht</span>
  <button id="undoBtn">Rückgängig</button>
</div>

<script>
  const CUR='CHF', LOCALE='de-CH';
  const K_BUDGET='budget_v5_monthly', K_EXP='budget_v5_expenses', K_CAT='budget_v5_cats', K_HIST='budget_v5_hist';
  const PALETTE=['#ff9f0a','#bf5af2','#0a84ff','#30d158','#ff453a','#5e5ce6','#ff2d55','#64d2ff','#ffd60a','#ac8e68'];
  const DEFAULT_CATS=[
    {id:'essen',name:'Essen',color:'#ff9f0a'},
    {id:'freizeit',name:'Freizeit',color:'#bf5af2'},
    {id:'transport',name:'Transport',color:'#0a84ff'},
    {id:'sonstiges',name:'Sonstiges',color:'#8e8e93'},
  ];

  let monthlyBudget=parseFloat(localStorage.getItem(K_BUDGET))||0;
  let expenses=JSON.parse(localStorage.getItem(K_EXP)||'[]');
  // Migration: alte Einträge ohne kind werden als Ausgabe behandelt
  expenses=expenses.map(e=>({...e, kind: e.kind || 'expense'}));
  let cats=JSON.parse(localStorage.getItem(K_CAT)||'null')||DEFAULT_CATS;
  if(!Array.isArray(cats)||!cats.length) cats=DEFAULT_CATS;
  let budgetHistory=JSON.parse(localStorage.getItem(K_HIST)||'{}');
  let viewMonth=new Date(); viewMonth.setDate(1);
  let selectedCat=cats[0].id;
  let currentKind='expense';
  let lastDeleted=null;
  let amountStr='';

  const fmt=n=>n.toLocaleString(LOCALE,{style:'currency',currency:CUR,minimumFractionDigits:2});
  const fmtSigned=n=>{
    const sign=n>=0?'+':'−';
    return sign+' '+Math.abs(n).toLocaleString(LOCALE,{style:'currency',currency:CUR,minimumFractionDigits:2});
  };
  const sameMonth=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();
  const sameDay=(a,b)=>sameMonth(a,b)&&a.getDate()===b.getDate();
  const isCurrent=d=>sameMonth(d,new Date());
  const catById=id=>cats.find(c=>c.id===id)||{name:'Sonstiges',color:'#8e8e93'};
  const ymKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

  function save(){
    localStorage.setItem(K_BUDGET,monthlyBudget);
    localStorage.setItem(K_EXP,JSON.stringify(expenses));
    localStorage.setItem(K_CAT,JSON.stringify(cats));
    localStorage.setItem(K_HIST,JSON.stringify(budgetHistory));
  }
  function parseAmount(s){
    if(!s) return null;
    const v=parseFloat(String(s).replace(',','.'));
    return isFinite(v)&&v>0?v:null;
  }

  function render(){
    const now=new Date(), current=isCurrent(viewMonth);
    document.getElementById('listTitle').textContent =
      current ? 'Diesen Monat' : viewMonth.toLocaleDateString(LOCALE,{month:'long',year:'numeric'});

    const monthExp=expenses.map(e=>({...e,date:new Date(e.date)}))
      .filter(e=>sameMonth(e.date,viewMonth))
      .sort((a,b)=>b.date-a.date);

    const spentMonth=monthExp.filter(e=>e.kind!=='income').reduce((s,e)=>s+e.amount,0);
    const incomeMonth=monthExp.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0);
    const spentToday=current
      ? monthExp.filter(e=>e.kind!=='income' && sameDay(e.date,now)).reduce((s,e)=>s+e.amount,0)
      : 0;

    const effectiveBudget=monthlyBudget+incomeMonth;
    const remainingMonth=effectiveBudget-spentMonth;

    const daysInMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,0).getDate();
    const dayNow=current?now.getDate():daysInMonth;
    const daysLeft=current?Math.max(1,daysInMonth-dayNow+1):0;
    const todayTotal=daysLeft>0?(effectiveBudget-(spentMonth-spentToday))/daysLeft:0;
    const available=todayTotal-spentToday;

    const hl=document.getElementById('heroLabel'), ha=document.getElementById('heroAmount'), hs=document.getElementById('heroSub');
    if(monthlyBudget<=0 && incomeMonth<=0){
      hl.textContent='Kein Budget gesetzt';
      ha.textContent='—'; ha.classList.remove('neg');
      hs.textContent='Tippe auf ⚙️ um dein Monatsbudget festzulegen';
    } else if(current){
      hl.textContent='Heute noch verfügbar';
      ha.textContent=fmt(available);
      ha.classList.toggle('neg',available<0);
      hs.textContent='Tagesbudget '+fmt(todayTotal);
    } else {
      hl.textContent='Rest im Monat';
      ha.textContent=fmt(remainingMonth);
      ha.classList.toggle('neg',remainingMonth<0);
      hs.textContent='Ausgegeben '+fmt(spentMonth);
    }
    document.getElementById('tileRest').textContent=fmt(remainingMonth);
    document.getElementById('tileDays').textContent=daysLeft?daysLeft+' Tage':'—';
    document.getElementById('addBtn').style.display=current?'flex':'none';

    const list=document.getElementById('list'); list.innerHTML='';
    if(!monthExp.length){
      const d=document.createElement('div'); d.className='empty';
      d.textContent='Noch keine Einträge'; list.appendChild(d);
    } else {
      for(const e of monthExp){
        const isIncome = e.kind==='income';
        const c=catById(e.category);
        const el=document.createElement('div'); el.className='item';

        const dot=document.createElement('span');
        dot.className='dot';
        dot.style.background = isIncome ? '#30d158' : c.color;

        const col=document.createElement('div'); col.className='col';
        const cat=document.createElement('div'); cat.className='cat'; cat.textContent=c.name;
        const time=document.createElement('div'); time.className='time';
        time.textContent=e.date.toLocaleString(LOCALE,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        col.appendChild(cat); col.appendChild(time);

        const amt=document.createElement('div');
        amt.className='amt'+(isIncome?' income':'');
        amt.textContent = (isIncome?'+ ':'') + fmt(e.amount);

        const trash=document.createElement('button');
        trash.className='trash-btn';
        trash.title='Löschen';
        trash.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        trash.onclick=(ev)=>{
          ev.stopPropagation();
          askDelete(e);
        };

        el.appendChild(dot); el.appendChild(col); el.appendChild(amt); el.appendChild(trash);

        el.onclick=()=>{
          const idx=expenses.findIndex(x=>x.id===e.id);
          if(idx<0) return;
          lastDeleted={exp:expenses[idx],idx};
          expenses.splice(idx,1);
          save(); render(); renderStats(); renderAdvancedStats(); showSnackbar('Eintrag gelöscht');
        };
        list.appendChild(el);
      }
    }
  }

  function renderStats(){
    const container=document.getElementById('statsList');
    container.innerHTML='';
    const byMonth={};
    for(const e of expenses){
      const d=new Date(e.date);
      const ym=ymKey(d);
      if(!byMonth[ym]) byMonth[ym]={spent:0,income:0};
      if(e.kind==='income') byMonth[ym].income+=e.amount;
      else byMonth[ym].spent+=e.amount;
    }
    const months=Object.keys(byMonth).sort().reverse();
    if(!months.length){
      const empty=document.createElement('div'); empty.className='stat-empty';
      empty.textContent='Noch keine Einträge erfasst'; container.appendChild(empty);
      return;
    }
    let totalBudget=0, totalSpent=0, totalIncome=0;
    for(const ym of months){
      const [y,m]=ym.split('-').map(Number);
      const budget=(budgetHistory[ym]!=null)?budgetHistory[ym]:monthlyBudget;
      const spent=byMonth[ym].spent;
      const income=byMonth[ym].income;
      const diff=budget+income-spent;
      totalBudget+=budget; totalSpent+=spent; totalIncome+=income;
      const row=document.createElement('div'); row.className='stat-row';
      const lbl=document.createElement('div'); lbl.className='stat-label';
      lbl.textContent=new Date(y,m-1,1).toLocaleDateString(LOCALE,{month:'long',year:'numeric'});
      const val=document.createElement('div');
      val.className='stat-value'+(diff<0?' neg':'');
      val.textContent=fmtSigned(diff);
      row.appendChild(lbl); row.appendChild(val);
      container.appendChild(row);
    }
    const totalDiff=totalBudget+totalIncome-totalSpent;
    const totalRow=document.createElement('div'); totalRow.className='stat-row total';
    const lbl=document.createElement('div'); lbl.className='stat-label'; lbl.textContent='Insgesamt';
    const val=document.createElement('div');
    val.className='stat-value'+(totalDiff<0?' neg':'');
    val.textContent=fmtSigned(totalDiff);
    totalRow.appendChild(lbl); totalRow.appendChild(val);
    container.appendChild(totalRow);
  }

  function renderAdvancedStats(){
    const content=document.getElementById('statsContent');
    const realExpenses=expenses.filter(e=>e.kind!=='income');
    const realIncomes=expenses.filter(e=>e.kind==='income');

    if(!expenses.length){
      content.innerHTML='<div class="stat-empty" style="padding:20px 0">Noch keine Daten.</div>';
      return;
    }

    const now=new Date();
    const allSorted=expenses.map(e=>({...e,date:new Date(e.date)})).sort((a,b)=>a.date-b.date);

    const totalSpent=realExpenses.reduce((s,e)=>s+e.amount,0);
    const totalIncome=realIncomes.reduce((s,e)=>s+e.amount,0);
    const expenseCount=realExpenses.length;
    const incomeCount=realIncomes.length;
    const netto=totalIncome-totalSpent;

    const firstDate=allSorted[0].date;
    const daysSinceFirst=Math.floor((now-firstDate)/(1000*60*60*24))+1;

    const monthAll=allSorted.filter(e=>sameMonth(e.date,now));
    const monthSpent=monthAll.filter(e=>e.kind!=='income').reduce((s,e)=>s+e.amount,0);
    const monthIncome=monthAll.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0);
    const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    const dayNow=now.getDate();
    const avgPerDay=monthSpent/dayNow;

    const dayTotals={};
    for(const e of monthAll){
      if(e.kind==='income') continue;
      const k=dayKey(e.date);
      dayTotals[k]=(dayTotals[k]||0)+e.amount;
    }
    const daysWithCount=Object.keys(dayTotals).length;
    const spartage=Math.max(0,dayNow-daysWithCount);

    let biggestDayKey=null,biggestDayAmt=0;
    for(const k in dayTotals){
      if(dayTotals[k]>biggestDayAmt){ biggestDayAmt=dayTotals[k]; biggestDayKey=k; }
    }

    let biggest=null, smallest=null, avg=0;
    if(expenseCount>0){
      biggest=realExpenses.reduce((a,b)=>a.amount>b.amount?a:b);
      smallest=realExpenses.reduce((a,b)=>a.amount<b.amount?a:b);
      avg=totalSpent/expenseCount;
    }

    const catTotals={},catCounts={};
    for(const e of realExpenses){
      catTotals[e.category]=(catTotals[e.category]||0)+e.amount;
      catCounts[e.category]=(catCounts[e.category]||0)+1;
    }
    let topCatId=null,topCatAmt=0;
    for(const k in catTotals) if(catTotals[k]>topCatAmt){ topCatAmt=catTotals[k]; topCatId=k; }
    let topUsedId=null,topUsedCount=0;
    for(const k in catCounts) if(catCounts[k]>topUsedCount){ topUsedCount=catCounts[k]; topUsedId=k; }

    const catName=id=>(catById(id)||{name:'—'}).name;
    const dayStr=k=>{
      const [y,m,d]=k.split('-').map(Number);
      return new Date(y,m-1,d).toLocaleDateString(LOCALE,{day:'2-digit',month:'long'});
    };

    let html='';

    html+=`
      <div class="stat-group">
        <div class="stat-group-title">Allzeit</div>
        <div class="stat-line"><span class="sl-label">Total ausgegeben</span><span class="sl-value">${fmt(totalSpent)}</span></div>
        <div class="stat-line"><span class="sl-label">Total eingenommen</span><span class="sl-value pos">${fmt(totalIncome)}</span></div>
        <div class="stat-line"><span class="sl-label">Netto</span><span class="sl-value${netto<0?'':' pos'}">${fmtSigned(netto)}</span></div>
        <div class="stat-line"><span class="sl-label">Anzahl Ausgaben</span><span class="sl-value">${expenseCount}</span></div>
        <div class="stat-line"><span class="sl-label">Anzahl Einnahmen</span><span class="sl-value">${incomeCount}</span></div>
        ${biggest?`<div class="stat-line"><span class="sl-label">Grösste Ausgabe</span><span class="sl-value">${fmt(biggest.amount)}<span class="sl-sub">${catName(biggest.category)}</span></span></div>`:''}
        ${smallest?`<div class="stat-line"><span class="sl-label">Kleinste Ausgabe</span><span class="sl-value">${fmt(smallest.amount)}<span class="sl-sub">${catName(smallest.category)}</span></span></div>`:''}
        ${expenseCount>0?`<div class="stat-line"><span class="sl-label">Ø pro Ausgabe</span><span class="sl-value">${fmt(avg)}</span></div>`:''}
        <div class="stat-line"><span class="sl-label">Dabei seit</span><span class="sl-value">${daysSinceFirst} ${daysSinceFirst===1?'Tag':'Tagen'}</span></div>
      </div>
    `;

    html+=`
      <div class="stat-group">
        <div class="stat-group-title">Dieser Monat</div>
        <div class="stat-line"><span class="sl-label">Ausgegeben</span><span class="sl-value">${fmt(monthSpent)}</span></div>
        <div class="stat-line"><span class="sl-label">Eingenommen</span><span class="sl-value pos">${fmt(monthIncome)}</span></div>
        <div class="stat-line"><span class="sl-label">Ø Ausgaben / Tag</span><span class="sl-value">${fmt(avgPerDay)}</span></div>
        <div class="stat-line"><span class="sl-label">Tage mit Ausgaben</span><span class="sl-value">${daysWithCount} / ${dayNow}</span></div>
        <div class="stat-line"><span class="sl-label">Spartage</span><span class="sl-value pos">${spartage}</span></div>
      </div>
    `;

    if(biggestDayKey){
      html+=`
        <div class="stat-group">
          <div class="stat-group-title">Rekord</div>
          <div class="stat-line"><span class="sl-label">Teuerster Tag</span><span class="sl-value">${fmt(biggestDayAmt)}<span class="sl-sub">${dayStr(biggestDayKey)}</span></span></div>
        </div>
      `;
    }

    if(topCatId||topUsedId){
      html+=`
        <div class="stat-group">
          <div class="stat-group-title">Ausgaben-Kategorien</div>
          ${topCatId?`<div class="stat-line"><span class="sl-label">Meiste Kosten</span><span class="sl-value">${catName(topCatId)}<span class="sl-sub">${fmt(topCatAmt)}</span></span></div>`:''}
          ${topUsedId?`<div class="stat-line"><span class="sl-label">Am häufigsten</span><span class="sl-value">${catName(topUsedId)}<span class="sl-sub">${topUsedCount}×</span></span></div>`:''}
        </div>
      `;
    }

    content.innerHTML=html;
  }

  function renderCats(){
    const wrap=document.getElementById('catChips'); wrap.innerHTML='';
    for(const c of cats){
      const b=document.createElement('button');
      b.className='cat-chip'+(c.id===selectedCat?' active':'');
      const dot=document.createElement('span'); dot.className='dot'; dot.style.background=c.color;
      b.appendChild(dot); b.appendChild(document.createTextNode(c.name));
      b.onclick=()=>{ selectedCat=c.id; renderCats(); };
      wrap.appendChild(b);
    }
    const add=document.createElement('button');
    add.className='cat-chip add'; add.textContent='+ Neu';
    add.onclick=()=>{
      document.getElementById('newCatRow').classList.toggle('open');
      if(document.getElementById('newCatRow').classList.contains('open')){
        setTimeout(()=>document.getElementById('newCatInput').focus(),50);
      }
    };
    wrap.appendChild(add);
  }

  document.getElementById('newCatSave').onclick=()=>{
    const name=document.getElementById('newCatInput').value.trim();
    if(!name) return;
    const id='c_'+Date.now();
    const color=PALETTE[cats.length%PALETTE.length];
    cats.push({id,name,color});
    selectedCat=id;
    document.getElementById('newCatInput').value='';
    document.getElementById('newCatRow').classList.remove('open');
    save(); renderCats();
  };
  document.getElementById('newCatInput').addEventListener('keydown',e=>{
    if(e.key==='Enter') document.getElementById('newCatSave').click();
  });

  const amountSheet=document.getElementById('amountSheet');
  const settingsSheet=document.getElementById('settingsSheet');
  const amountVal=document.getElementById('amountValue');
  const amountDisplay=document.getElementById('amountDisplay');
  const saveBtn=document.getElementById('saveBtn');
  const sheetTitle=document.getElementById('sheetTitle');
  const voiceBanner=document.getElementById('voiceBanner');
  const segmented=document.getElementById('segmented');

  function openSheet(sh){ sh.classList.add('open'); document.body.classList.add('locked'); }
  function closeSheet(sh){
    sh.classList.remove('open');
    if(!document.querySelector('.sheet.open')) document.body.classList.remove('locked');
  }

  function updateAmount(){
    if(!amountStr){
      amountVal.textContent='0'; amountVal.classList.add('empty');
    } else {
      amountVal.textContent=amountStr; amountVal.classList.remove('empty');
    }
    saveBtn.disabled=parseAmount(amountStr)===null;
  }

  function setKind(kind){
    currentKind=kind;
    segmented.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('active', b.dataset.kind===kind);
    });
    sheetTitle.textContent = kind==='income' ? 'Neue Einnahme' : 'Neue Ausgabe';
    amountDisplay.classList.toggle('income', kind==='income');
    saveBtn.classList.toggle('income', kind==='income');
  }

  segmented.addEventListener('click',e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    setKind(btn.dataset.kind);
  });

  function pressKey(k){
    hideVoiceBanner();
    if(k==='back'){
      amountStr=amountStr.slice(0,-1);
    } else if(k===','){
      if(amountStr.includes(',')) return;
      if(!amountStr) amountStr='0';
      amountStr+=',';
    } else {
      const commaIdx=amountStr.indexOf(',');
      if(commaIdx>=0){
        if(amountStr.length-commaIdx-1>=2) return;
      } else {
        if(amountStr==='0') amountStr='';
        if(amountStr.replace(',','').length>=7) return;
      }
      amountStr+=k;
    }
    updateAmount();
  }

  document.getElementById('numpad').addEventListener('click',e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    pressKey(btn.dataset.key);
  });

  document.getElementById('addBtn').onclick=()=>{
    amountStr=''; updateAmount();
    hideVoiceBanner();
    setKind('expense');
    document.getElementById('newCatRow').classList.remove('open');
    document.getElementById('newCatInput').value='';
    renderCats(); openSheet(amountSheet);
  };
  saveBtn.onclick=()=>{
    const v=parseAmount(amountStr); if(v===null) return;
    expenses.push({
      id:(crypto.randomUUID?crypto.randomUUID():'x'+Date.now()+Math.random()),
      amount:v, category:selectedCat, kind:currentKind, date:new Date().toISOString()
    });
    save(); hideVoiceBanner(); closeSheet(amountSheet); render(); renderStats(); renderAdvancedStats();
  };

  [amountSheet,settingsSheet].forEach(sh=>{
    sh.addEventListener('click',e=>{ if(e.target===sh) closeSheet(sh); });
  });

  document.getElementById('gearBtn').onclick=()=>{
    document.getElementById('budgetInput').value=monthlyBudget>0?monthlyBudget:'';
    updateMonthNav(); renderStats(); renderAdvancedStats(); openSheet(settingsSheet);
  };

  document.getElementById('budgetSave').onclick=()=>{
    monthlyBudget=parseAmount(document.getElementById('budgetInput').value)||0;
    if(monthlyBudget>0) budgetHistory[ymKey(new Date())]=monthlyBudget;
    save(); render(); renderStats(); showSnackbar('Budget gespeichert');
  };

  document.getElementById('statsToggle').onclick=()=>{
    document.getElementById('statsToggle').classList.toggle('open');
    document.getElementById('statsContent').classList.toggle('open');
  };

  function updateMonthNav(){
    const now=new Date();
    const curM=new Date(now.getFullYear(),now.getMonth(),1);
    document.getElementById('nextMonth').disabled=viewMonth>=curM;
    document.getElementById('monthLabel').textContent=
      viewMonth.toLocaleDateString(LOCALE,{month:'long',year:'numeric'});
  }
  document.getElementById('prevMonth').onclick=()=>{
    viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);
    updateMonthNav(); render();
  };
  document.getElementById('nextMonth').onclick=()=>{
    const next=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);
    const now=new Date();
    if(next<=new Date(now.getFullYear(),now.getMonth(),1)){
      viewMonth=next; updateMonthNav(); render();
    }
  };

  document.getElementById('exportBtn').onclick=()=>{
    const data={monthlyBudget,budgetHistory,cats,expenses,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='budget-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(url);
  };

  document.getElementById('clearMonthBtn').onclick=()=>{
    const label=viewMonth.toLocaleDateString(LOCALE,{month:'long',year:'numeric'});
    if(!confirm(`Alle Einträge für ${label} löschen?`)) return;
    expenses=expenses.filter(e=>!sameMonth(new Date(e.date),viewMonth));
    save(); render(); renderStats(); renderAdvancedStats(); showSnackbar('Monat geleert');
  };

  let snackTimer=null;
  function showSnackbar(t){
    document.getElementById('snackText').textContent=t;
    const bar=document.getElementById('snackbar');
    bar.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer=setTimeout(()=>bar.classList.remove('show'),4000);
  }
  document.getElementById('undoBtn').onclick=()=>{
    if(!lastDeleted) return;
    expenses.splice(Math.min(lastDeleted.idx,expenses.length),0,lastDeleted.exp);
    lastDeleted=null; save(); render(); renderStats(); renderAdvancedStats();
    document.getElementById('snackbar').classList.remove('show');
  };

  const confirmModal=document.getElementById('confirmModal');
  let pendingDelete=null;
  function askDelete(expense){
    const c=catById(expense.category);
    const isIncome = expense.kind==='income';
    document.getElementById('confirmTitle').textContent = isIncome ? 'Einnahme löschen?' : 'Ausgabe löschen?';
    document.getElementById('confirmBody').innerHTML=
      `<b>${c.name}</b><br>${isIncome?'+ ':''}${fmt(expense.amount)}`;
    pendingDelete=expense;
    confirmModal.classList.add('open');
    document.body.classList.add('locked');
  }
  function closeConfirm(){
    pendingDelete=null;
    confirmModal.classList.remove('open');
    if(!document.querySelector('.sheet.open')) document.body.classList.remove('locked');
  }
  document.getElementById('confirmCancel').onclick=closeConfirm;
  document.getElementById('confirmOk').onclick=()=>{
    if(pendingDelete){
      const idx=expenses.findIndex(x=>x.id===pendingDelete.id);
      if(idx>=0){
        lastDeleted={exp:expenses[idx],idx};
        expenses.splice(idx,1);
        save(); render(); renderStats(); renderAdvancedStats();
        showSnackbar('Eintrag gelöscht');
      }
    }
    closeConfirm();
  };
  confirmModal.addEventListener('click',e=>{
    if(e.target===confirmModal) closeConfirm();
  });

  function enableSwipeToClose(sheet){
    const inner=sheet.querySelector('.sheet-inner');
    let startY=0, active=false, moved=false;
    inner.addEventListener('touchstart',e=>{
      if(inner.scrollTop>0) return;
      startY=e.touches[0].clientY; active=true; moved=false;
      inner.style.transition='none';
    },{passive:true});
    inner.addEventListener('touchmove',e=>{
      if(!active) return;
      const dy=e.touches[0].clientY-startY;
      if(dy>0){
        moved=true;
        inner.style.transform=`translateY(${dy}px)`;
        e.preventDefault();
      }
    },{passive:false});
    inner.addEventListener('touchend',e=>{
      if(!active) return;
      active=false;
      const dy=e.changedTouches[0].clientY-startY;
      inner.style.transition='';
      if(dy>80 && moved){
        inner.style.transition='transform .25s cubic-bezier(.32,.72,0,1)';
        inner.style.transform='translateY(100%)';
        sheet.style.transition='opacity .25s';
        sheet.style.opacity='0';
        setTimeout(()=>{
          if(sheet.classList.contains('open')) closeSheet(sheet);
          inner.style.transition=''; inner.style.transform='';
          sheet.style.transition=''; sheet.style.opacity='';
        },260);
      } else {
        inner.style.transform='';
      }
    });
  }
  enableSwipeToClose(amountSheet);
  enableSwipeToClose(settingsSheet);

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn=document.getElementById('micBtn');
  let recognition=null, recognizing=false;

  function showVoiceBanner(amount, rawText){
    const label=voiceBanner.querySelector('.vb-text');
    if(amount!=null){
      voiceBanner.classList.remove('error');
      label.innerHTML='Erkannt: <b>'+fmt(amount)+'</b>';
    } else {
      voiceBanner.classList.add('error');
      label.innerHTML='Nicht erkannt: <b>'+(rawText||'—')+'</b>';
    }
    voiceBanner.classList.add('show');
  }
  function hideVoiceBanner(){ voiceBanner.classList.remove('show'); }
  document.getElementById('voiceClear').onclick=hideVoiceBanner;

  function parseSpokenAmount(text){
    if(!text) return null;
    let t=text.toLowerCase().trim();
    t=t.replace(/\b(chf|frank|franken|rappen|für|ich|habe|ausgegeben|bezahlt|kostet|kostete|verdient|eingenommen|bekommen|noch|und)\b/g,' ');
    t=t.replace(/\bkomma\b/g,'.');
    t=t.replace(/\s+/g,' ').trim();
    let m=t.match(/(\d+)[.,](\d{1,2})/);
    if(m) return parseFloat(m[1]+'.'+m[2]);
    m=t.match(/(?:^|\s)(\d{1,4})\s+(\d{1,2})(?:\s|$)/);
    if(m) return parseFloat(m[1]+'.'+m[2].padStart(2,'0'));
    m=t.match(/(\d+(?:[.,]\d+)?)/);
    if(m) return parseFloat(m[1].replace(',','.'));
    return null;
  }
  function formatAmountStr(n){
    const r=Math.round(n*100)/100;
    if(r%1===0) return String(r);
    return r.toFixed(2).replace('.',',');
  }

  if(!SpeechRecognition){
    micBtn.style.display='none';
  } else {
    micBtn.addEventListener('click',()=>{
      if(recognizing){
        try{ recognition.stop(); }catch(e){}
        return;
      }
      recognition=new SpeechRecognition();
      recognition.lang='de-CH';
      recognition.interimResults=false;
      recognition.maxAlternatives=1;
      recognition.continuous=false;
      recognition.onstart=()=>{
        recognizing=true;
        micBtn.classList.add('recording');
        hideVoiceBanner();
      };
      recognition.onresult=(e)=>{
        const text=e.results[0][0].transcript;
        const amount=parseSpokenAmount(text);
        if(amount!=null && amount>0){
          amountStr=formatAmountStr(amount);
          updateAmount();
          showVoiceBanner(amount,text);
        } else {
          showVoiceBanner(null,text);
        }
      };
      recognition.onerror=(e)=>{
        recognizing=false;
        micBtn.classList.remove('recording');
        if(e.error==='not-allowed'||e.error==='service-not-allowed'){
          showVoiceBanner(null,'Mikrofon nicht erlaubt');
        } else if(e.error==='no-speech'){
          showVoiceBanner(null,'Nichts gehört');
        } else if(e.error==='network'){
          showVoiceBanner(null,'Keine Verbindung');
        } else {
          showVoiceBanner(null,'Fehler');
        }
      };
      recognition.onend=()=>{
        recognizing=false;
        micBtn.classList.remove('recording');
      };
      try{ recognition.start(); }catch(e){ console.warn(e); }
    });
  }

  setKind('expense');
  renderCats(); render(); renderStats(); renderAdvancedStats(); updateAmount();
</script>
</body>
</html>
